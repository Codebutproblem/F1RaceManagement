server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: teams-drivers-service
          uri: lb://teams-drivers-service
          predicates:
            - Path=/api/teams/**,/api/drivers/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: sponsorship-service
          uri: lb://sponsorship-service
          predicates:
            - Path=/api/sponsors/**,/api/contracts/**,/api/sponsorship-types/**,/api/payments/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: prize-payment-service
          uri: lb://prize-payment-service
          predicates:
            - Path=/api/prize-payments/**,/api/prize-structures/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: race-management-service
          uri: lb://race-management-service
          predicates:
            - Path=/api/races/**,/api/results/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
